# Bring the index up to date with the cookbook's latest commit. Run by hand from the Actions tab: no schedule.
# It only runs ask_the_cookbook.refresh, the same one that runs locally; the commit it makes goes straight to main.
#
# Set in the repo's Settings > Secrets and variables > Actions:
#   secret   GEMINI_API_KEY   the embeddings
#   secret   HF_TOKEN         a Hugging Face token with write access to the Space
#   variable HF_SPACE         the Space, as <hf-user>/ask-the-cookbook
# Without HF_TOKEN and HF_SPACE the refresh still runs and commits; it just isn't pushed to the Space.

name: Refresh the index

on:
  workflow_dispatch:

permissions:
  contents: write

# two refreshes at once would embed the same files twice and race to push
concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # whether the Space push can run, without handing the token itself to every step
      CAN_PUSH_TO_SPACE: ${{ secrets.HF_TOKEN != '' && vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true           # the vector store is in LFS: without this the script would read a pointer file

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"     # the Space's
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ask_the_cookbook.refresh

      # Nothing to commit when the cookbook had no new commit. A commit pushed with this workflow's token does
      # not trigger other workflows, so the Space sync on push to main will not see it: the next step pushes it.
      - name: Commit
        id: commit
        run: |
          git add -A data/corpus data/index README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(jq -r .commit data/index/cookbook.json | cut -c1-7)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the index to cookbook $commit"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # the copy uploads the folder as it is: leave only what was committed (no __pycache__ from the refresh)
      - name: Clean
        if: steps.commit.outputs.changed == 'true' && env.CAN_PUSH_TO_SPACE == 'true'
        run: git clean -fdx

      # the same copy as the sync workflow (sync-to-space.yml), of the files just committed
      - name: Copy to the Space
        if: steps.commit.outputs.changed == 'true' && env.CAN_PUSH_TO_SPACE == 'true'
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE }}
          hf_token: ${{ secrets.HF_TOKEN }}
